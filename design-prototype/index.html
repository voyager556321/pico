<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- Pico DS tokens (Dark) ---------- */
:root{
  color-scheme:dark;
  --bg-page:#111115; --surface-primary:#1c1c22; --surface-secondary:#25252c; --surface-field:rgba(0,0,0,.25);
  --text-primary:#f4f4f5; --text-secondary:#b4b4be; --text-muted:#8f8f9a; --text-disabled:#70707b; --text-on-accent:#fff; --text-accent:#8b8bff;
  --border-default:#34343e; --border-strong:#44444f;
  --status-success:#34d399; --status-warning:#fbbf24; --status-error:#f87171; --status-revision:#fb923c;
  --indigo-400:#8b8bff; --indigo-500:#5b5bf0;
  --white-a4:rgba(255,255,255,.04); --white-a6:rgba(255,255,255,.06); --white-a10:rgba(255,255,255,.1); --white-a16:rgba(255,255,255,.16); --ink-a25:rgba(0,0,0,.25);
  --tint-accent:rgba(91,91,240,.14); --tint-accent-strong:rgba(91,91,240,.24); --tint-accent-border:rgba(139,139,255,.4);
  --tint-success:rgba(52,211,153,.12); --tint-success-border:rgba(52,211,153,.3);
  --tint-warning:rgba(251,191,36,.12); --tint-error:rgba(248,113,113,.12); --tint-error-border:rgba(248,113,113,.32);
  --ai-gradient-button:linear-gradient(180deg,#7b7bff,#4f46e5);
  --button-glow:0 4px 18px rgba(92,92,240,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(51,46,153,.35);
  --focus-ring:0 0 0 3px rgba(91,91,240,.45);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:8px; --r-m:10px; --r-l:12px; --r-xl:16px;
  --dur:.15s;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased}
html{scrollbar-gutter:stable;overflow-x:clip}body{overflow-x:clip;max-width:100%}
button,input,textarea{font-family:inherit}

/* ---------- Prototype chrome ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(17,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-default)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--ai-gradient-button);display:grid;place-items:center;font-style:normal;font-size:12px}
.tag{font:700 11px/16px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--text-accent);background:var(--tint-accent);padding:3px 8px;border-radius:999px}
.hint{font:500 12px/16px var(--font);color:var(--text-muted)}
.spacer{flex:1}
.bar select,.bar .tbtn{font:600 13px/18px var(--font);color:var(--text-primary);background:var(--surface-secondary);border:1px solid var(--border-strong);border-radius:var(--r-m);padding:7px 12px;cursor:pointer}
.bar select:focus-visible,.bar .tbtn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.bar .tbtn[aria-pressed="true"]{background:var(--tint-accent-strong);border-color:var(--tint-accent-border);color:var(--text-accent)}
@media (max-width:760px){.hint{display:none}}

/* ---------- Stage (1440 artboard scaled to viewport) ---------- */
.viewport{position:relative;overflow:hidden;overflow:clip;margin:0 auto;max-width:1440px}
.stage{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
.stage>img{display:block;width:1440px;height:auto;user-select:none;-webkit-user-drag:none}
.c{position:absolute}

/* ---------- Button (state layer over the Figma render; face painted for Loading / Disabled) ---------- */
.btn{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;color:inherit}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:transparent;transition:background var(--dur)}
.btn.s-L{border-radius:var(--r-l)} .btn.s-M{border-radius:var(--r-m)} .btn.s-S{border-radius:var(--r-s)}
.btn:hover::after{background:var(--white-a6)}
.btn.v-p:hover::after{background:var(--white-a10)}
.btn:active::after,.btn.pressed::after{background:var(--ink-a25)}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn.v-p:focus-visible{box-shadow:var(--button-glow),var(--focus-ring)}
.face{position:absolute;inset:0;border-radius:inherit;display:none;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:var(--u)}
.btn.s-L .face{font:700 15px/22px var(--font)} .btn.s-M .face{font:700 14px/20px var(--font)} .btn.s-S .face{font:600 13px/18px var(--font)}
.btn.loading .face,.btn.disabled .face{display:flex}
.btn.loading,.btn.disabled{cursor:default}
.btn.loading::after,.btn.disabled::after{display:none}
.btn.disabled{cursor:not-allowed}
.btn.v-p.loading .face{background:var(--ai-gradient-button);color:var(--text-on-accent);box-shadow:var(--button-glow)}
.btn.v-s.loading .face{background:linear-gradient(var(--white-a6),var(--white-a6)),var(--u);border:1px solid var(--border-strong);color:var(--text-primary)}
.btn.v-g.loading .face{color:var(--text-secondary)}
.btn.v-d.loading .face{background:linear-gradient(var(--tint-error),var(--tint-error)),var(--u);border:1px solid var(--tint-error-border);color:var(--status-error)}
.btn.disabled .face{background:linear-gradient(var(--white-a4),var(--white-a4)),var(--u);border:1px solid var(--border-default);color:var(--text-disabled);box-shadow:none}
.btn.v-g.disabled .face{background:var(--u);border-color:transparent}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Nav item / row / link state layers ---------- */
.layer{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;transition:background var(--dur),box-shadow var(--dur)}
.layer.nav{border-radius:var(--r-m)}
.layer.nav:hover{background:var(--white-a4)}
.layer.nav[aria-current="page"]{cursor:default;background:transparent}
.layer.row{border-radius:var(--r-xl)}
.layer.row:hover{background:var(--white-a4);box-shadow:inset 0 0 0 1px var(--tint-accent-border)}
.layer.link{border-radius:6px}
.layer.link:hover{background:var(--tint-accent)}
.layer:active{background:var(--ink-a25)}
.layer:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ---------- Tabs ---------- */
.tabs{position:absolute;left:0;top:0;width:0;height:0}
.tab{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-s);
  background:var(--u);color:var(--text-secondary);font:600 14px/20px var(--font);cursor:pointer;padding:0 8px;white-space:nowrap;transition:color var(--dur),background var(--dur)}
.tab{box-shadow:0 0 0 3px var(--u)}
.clear[hidden]{display:none}
.tab:hover{color:var(--text-primary);background:linear-gradient(var(--white-a4),var(--white-a4)),var(--u)}
.tab[aria-selected="true"]{z-index:2;box-shadow:none;background:var(--sb);border-color:var(--border-strong);color:var(--text-primary);cursor:default}
.tab:focus-visible{outline:none;box-shadow:var(--focus-ring);z-index:3}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:6px;background:var(--white-a6);color:var(--text-muted);font:600 12px/20px var(--font);text-align:center}
.count.new{background:var(--indigo-500);color:var(--text-on-accent)}

/* ---------- Chip / Filter ---------- */
.chip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:var(--r-m);cursor:pointer;white-space:nowrap;
  font:600 14px/20px var(--font);background:linear-gradient(var(--white-a6),var(--white-a6)),var(--u);border:1px solid var(--border-strong);color:var(--text-primary);
  transition:background var(--dur),border-color var(--dur),color var(--dur)}
.chip:hover{border-color:var(--white-a16);background:linear-gradient(var(--white-a10),var(--white-a10)),var(--u)}
.chip[aria-pressed="true"]{background:linear-gradient(var(--tint-accent-strong),var(--tint-accent-strong)),var(--u);border-color:var(--tint-accent-border);color:var(--text-accent)}
.chip[aria-pressed="true"]:hover{border-color:var(--indigo-400)}
.chip:active{transform:scale(.98)}
.chip:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ---------- Toggle ---------- */
.tgl{position:absolute;width:40px;height:24px;border-radius:12px;border:0;padding:0;cursor:pointer;background:var(--border-default);transition:background var(--dur)}
.tgl::before{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-secondary);transition:transform var(--dur),background var(--dur)}
.tgl:hover{background:var(--border-strong)}
.tgl[aria-checked="true"]{background:var(--indigo-500)}
.tgl[aria-checked="true"]:hover{background:#6b6bf5}
.tgl[aria-checked="true"]::before{transform:translateX(16px);background:#fff}
.tgl:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ---------- Input ---------- */
.field{position:absolute;display:flex;align-items:center;gap:10px;padding:0 15px;border-radius:var(--r-l);background:var(--f);border:1px solid var(--border-default);
  transition:border-color var(--dur),box-shadow var(--dur)}
.field:hover{border-color:var(--border-strong)}
.field.focus{border:1.5px solid var(--indigo-500);padding:0 14.5px}
.field.error{border:1.5px solid var(--status-error);padding:0 14.5px}
.field.success{border-color:rgba(52,211,153,.45)}
.field.area{align-items:flex-start;padding-top:12px}
.field input,.field textarea{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text-primary);font:500 15px/22px var(--font);padding:0}
.field textarea{resize:none;height:100%;padding-bottom:12px}
.field input::placeholder,.field textarea::placeholder{color:var(--text-muted)}
.field .ico{flex:none;width:18px;height:18px;color:var(--text-muted)}
.badge-ok,.badge-err{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.badge-ok{background:var(--tint-success);color:var(--status-success)}
.badge-err{background:var(--tint-error);color:var(--status-error)}
.field .spin{color:var(--text-muted)}
.clear{flex:none;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--text-muted);cursor:pointer;display:grid;place-items:center}
.clear:hover{background:var(--white-a6);color:var(--text-primary)}
.clear:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.helper{position:absolute;display:flex;align-items:center;gap:6px;background:var(--u);font:400 13px/19px var(--font);color:var(--text-muted);white-space:nowrap;overflow:hidden}
.helper.success{color:var(--status-success)} .helper.error{color:var(--status-error)} .helper.warning{color:var(--status-warning)}
.sel{cursor:pointer;color:var(--text-primary);font:500 15px/22px var(--font);justify-content:space-between;text-align:left}
.sel .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel:focus-visible{outline:none}
.sel.focus{box-shadow:none}
.menu{position:absolute;z-index:40;padding:6px;border-radius:var(--r-l);background:var(--surface-secondary);border:1px solid var(--border-strong);
  box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;height:36px;padding:0 10px;border:0;border-radius:var(--r-s);background:transparent;
  color:var(--text-secondary);font:500 14px/20px var(--font);cursor:pointer;text-align:left;white-space:nowrap}
.opt:hover,.opt:focus-visible{background:var(--white-a6);color:var(--text-primary);outline:none}
.opt[aria-selected="true"]{color:var(--text-primary)}
.opt svg{color:var(--indigo-400)}
.composer-ring{position:absolute;border-radius:var(--r-xl);pointer-events:none;transition:box-shadow var(--dur)}
.composer-ring.on{box-shadow:var(--focus-ring)}
.bare{position:absolute;border:0;outline:0;background:var(--u);color:var(--text-primary);padding:0}
.bare::placeholder{color:var(--text-muted)}

/* ---------- FAQ ---------- */
.faq{position:absolute;background:var(--u)}
.fi{border-bottom:1px solid var(--border-default)}
.fi:last-child{border-bottom:0}
.fq{display:flex;align-items:center;justify-content:space-between;width:100%;height:58px;border:0;background:transparent;color:var(--text-primary);
  font:700 15px/22px var(--font);cursor:pointer;padding:0;text-align:left;border-radius:var(--r-s)}
.fq:hover{color:#fff}
.fq:hover svg{color:var(--text-primary)}
.fq:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.fq svg{color:var(--text-muted);transition:transform var(--dur);margin-right:8px}
.fi.open .fq svg{transform:rotate(90deg)}
.fa{display:none;margin:-10px 0 0;padding:0 0 17px;color:var(--text-muted);font:400 14px/21px var(--font)}
.fi.open .fa{display:block}

/* ---------- Live primary face, dynamic text, lock layer ---------- */
.btn.live .face{display:flex}
.btn.v-p.live .face{background:var(--ai-gradient-button);color:var(--text-on-accent);box-shadow:var(--button-glow)}
.btn.live.disabled .face{background:linear-gradient(var(--white-a4),var(--white-a4)),var(--u);color:var(--text-disabled);box-shadow:none;border:1px solid var(--border-default)}
.dyn{position:absolute;display:flex;align-items:center;background:var(--u);color:var(--text-primary);font:600 14px/20px var(--font);white-space:nowrap;overflow:hidden;pointer-events:none}
.dyn.right{justify-content:flex-end}
.dyn.amt{font:800 40px/44px var(--font);letter-spacing:-.02em}
.dyn.big{font:700 28px/34px var(--font);letter-spacing:-.01em}
.dyn.muted{color:var(--text-muted)} .dyn.error{color:var(--status-error)} .dyn.secondary{color:var(--text-secondary)}
.dyn.wrap{white-space:normal;align-items:flex-start;font:400 13px/19px var(--font);color:var(--text-secondary)}
.dyn.step,.dyn.sub,.dyn.val{display:block;text-overflow:ellipsis}
.dyn.step{font:500 12px/17px var(--font);color:#9d9ca5}
.dyn.sub{font:500 13px/18px var(--font);color:#9d9ca5}
.dyn.val{font:500 14px/20px var(--font);color:var(--text-primary);text-align:right}
.layer.lock{border-radius:var(--r-l);cursor:not-allowed}
.fig{position:absolute;left:0;top:0;width:1440px;overflow:hidden;background:var(--bg-page)}
.fig div,.fig i{position:absolute;box-sizing:border-box;margin:0}
.fig .ft{display:flex;font-kerning:normal}
.fig .fi{line-height:0}.fig .fi svg{display:block;overflow:visible}
.fig .fs{inset:0;border-radius:inherit;pointer-events:none;font-style:normal}


/* ---------- Modal (Modal/Add funds) ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(17,17,21,.8);display:grid;place-items:center;padding:16px;overflow:auto}
.scrim[hidden]{display:none}
.modal{width:min(480px,100%);display:flex;flex-direction:column;gap:20px;padding:28px;border-radius:20px;background:var(--surface-primary);border:1px solid var(--border-strong);box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal h2{margin:0;font:700 22px/28px var(--font);color:var(--text-primary)}
.modal .sub{margin:6px 0 0;font:400 13px/19px var(--font);color:var(--text-muted)}
.mbox{display:flex;flex-direction:column;padding:4px 16px;border-radius:var(--r-l);background:var(--white-a4);border:1px solid var(--border-default)}
.mrow{display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border-default)}
.mrow:last-child{border-bottom:0}
.mrow .k{font:400 14px/21px var(--font);color:var(--text-secondary)} .mrow .v{margin-left:auto;font:600 14px/20px var(--font);color:var(--text-primary);text-align:right}
.wallet{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-l);background:var(--white-a4);border:1px solid var(--border-default)}
.wallet b{display:block;font:600 13px/18px var(--font);color:var(--text-primary)} .wallet small{display:block;font:500 12px/16px var(--font);color:var(--text-muted)}
.wallet .r{margin-left:auto;text-align:right}
.mlabel{font:600 13px/18px var(--font);color:var(--text-primary);margin-bottom:8px;display:block}
.mfield{position:relative;display:flex;align-items:center;gap:10px;height:44px;padding:0 15px;border-radius:var(--r-l);background:rgba(0,0,0,.25);border:1px solid var(--border-default)}
.mfield:hover{border-color:var(--border-strong)} .mfield.focus{border:1.5px solid var(--indigo-500);padding:0 14.5px} .mfield.error{border:1.5px solid var(--status-error);padding:0 14.5px} .mfield.disabled{opacity:.55}
.mfield input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text-primary);font:500 15px/22px var(--font)}
.mhelp{margin-top:8px;font:400 13px/19px var(--font);color:var(--text-muted)} .mhelp.error{color:var(--status-error)}
.quick{display:flex;gap:8px}
.quick .chip{position:static;height:34px;padding:0 16px;flex:1}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-l);font:400 13px/19px var(--font);color:var(--text-secondary);background:var(--tint-accent);border:1px solid var(--tint-accent-border)}
.callout svg{flex:none;color:var(--indigo-400);margin-top:1px}
.callout.success{background:var(--tint-success);border-color:var(--tint-success-border)} .callout.success svg{color:var(--status-success)}
.callout.error{background:var(--tint-error);border-color:var(--tint-error-border)} .callout.error svg{color:var(--status-error)}
.mactions{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.mactions .demo{margin-right:auto}
.mb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r-m);font:700 14px/20px var(--font);cursor:pointer;border:1px solid transparent;white-space:nowrap}
.mb.p{background:var(--ai-gradient-button);color:#fff;box-shadow:var(--button-glow)}
.mb.p:hover{filter:brightness(1.08)} .mb.p:active{filter:brightness(.85)}
.mb.s{background:linear-gradient(var(--white-a6),var(--white-a6)),var(--surface-primary);border-color:var(--border-strong);color:var(--text-primary)}
.mb.s:hover{background:linear-gradient(var(--white-a10),var(--white-a10)),var(--surface-primary)}
.mb.g{background:transparent;color:var(--text-accent);padding:0 10px} .mb.g:hover{background:var(--tint-accent)}
.mb.demo{height:32px;font:600 12px/16px var(--font);color:var(--text-muted);background:transparent;padding:0 8px} .mb.demo:hover{color:var(--text-primary)}
.mb:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.mb[disabled]{cursor:not-allowed;background:linear-gradient(var(--white-a4),var(--white-a4)),var(--surface-primary);border-color:var(--border-default);color:var(--text-disabled);box-shadow:none;filter:none}

/* ---------- Chrome, dialogs, popovers ---------- */
.dim{position:absolute;background:rgba(17,17,21,.74);border-radius:14px;pointer-events:none;transition:opacity var(--dur)}
.dim[hidden]{display:none}
.layer.chrome{border-radius:10px}.layer.chrome:hover{background:var(--white-a4)}
.mfield.area{height:auto;padding:12px 15px;align-items:flex-start}.mfield.area.focus,.mfield.area.error{padding:11.5px 14.5px}
.mfield textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text-primary);font:500 15px/22px var(--font);resize:vertical;min-height:66px}
.mfield textarea::placeholder,.mfield input::placeholder{color:var(--text-muted)}
.msel{flex:1;border:0;outline:0;background:transparent;color:var(--text-primary);font:500 15px/22px var(--font);appearance:none;cursor:pointer}
.msel option{background:var(--surface-secondary)}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--border-default);background:var(--white-a4);cursor:pointer;font:400 14px/20px var(--font);color:var(--text-secondary)}
.chk:hover{border-color:var(--border-strong)}
.chk input{position:absolute;opacity:0}
.chk .box{flex:none;width:18px;height:18px;margin-top:1px;border-radius:5px;border:1.5px solid var(--border-strong);display:grid;place-items:center}
.chk input:checked+.box{background:var(--indigo-500);border-color:var(--indigo-500)}
.chk input:checked+.box::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:checked~span:last-child{color:var(--text-primary)}
.chk input:focus-visible+.box{box-shadow:var(--focus-ring)}
.mb.d{background:linear-gradient(var(--tint-error),var(--tint-error)),var(--surface-primary);border-color:var(--tint-error-border);color:var(--status-error)}
.mb.d:hover{background:linear-gradient(rgba(248,113,113,.2),rgba(248,113,113,.2)),var(--surface-primary)}
.pop{position:fixed;z-index:68;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:var(--surface-secondary);border:1px solid var(--border-strong);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.pop[hidden]{display:none}

function mkInput(c){

  if(c.t==='email'){i.type='email';i.placeholder='you@company.com'}

  if(area){i.maxLength=c.max;i.placeholder='What your company builds, in one sentence.'}

  let st='default',timer;
  const paint=(s,msg)=>{st=s;f.classList.toggle('error',s==='error');f.classList.toggle('success',s==='success');
    i.setAttribute('aria-invalid',String(s==='error'));
    tail.innerHTML=s==='success'?'<span class="badge-ok">'+ICON.check+'</span>':s==='error'?'<span class="badge-err">'+ICON.alert+'</span>':s==='validating'?'<span class="spin"></span>':'';

  const count=()=>{const n=i.value.length;paint(n===0?'error':'default',n===0?'Add a short description — workers see it on every task.':n+' / '+c.max+' · Keep it about your product — scope and criteria go into each task.');
    if(n>=c.max-10&&n>0)hp.classList.add('warning')};

    clearTimeout(timer);const v=i.value.trim();

      if(!v){paint('default',HELP.web.def);return}

    if(k===cur&&anchor){const el=stage.querySelector('#'+anchor);el&&el.scrollIntoView({behavior:'smooth',block:'start'});return}
    show(k);if(anchor)setTimeout(()=>{const el=stage.querySelector('#'+anchor);el&&el.scrollIntoView({block:'start'})},60)}));
  root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();act(b.dataset.act,b)}));
}
function rail(steps){return '<div class="rail" style="grid-template-columns:repeat('+steps.length+',1fr)">'+steps.map((s,i)=>'<div class="rs '+s[2]+(i===0?' first':'')+'"><div class="ln"><span class="d"></span>'+(i<steps.length-1?'<span class="rbar"></span>':'')+'</div><div><b>'+E(s[0])+'</b><small>'+E(s[1])+'</small></div></div>').join('')+'</div>'}
function critList(t,mode){return '<div class="lst">'+t.crit.map((c,i)=>{const nm=t.notMet&&t.notMet.includes(i),dis=t.dcrit===i;
  const right=mode==='met'?'<span class="pill success">Met</span>':nm?'<span class="pill rev">Not met</span>':dis?'<span class="pill error">In dispute</span>':'<span class="lk">'+IC.lock+'</span>';
  return '<div class="li"><span class="num">'+(i+1)+'</span><div class="tx"><b style="font-weight:500">'+E(c)+'</b></div>'+right+'</div>'}).join('')+'</div>'}

  (note?'<div class="callout">'+ICON.info+'<span>'+note+'</span></div>':'')+'<div class="msgs" id="msgs">'+msgs(t.chat||t.thread||[],t.worker)+'</div>'+
  '<div class="composer"><div class="mfield"><input id="cMsg" placeholder="'+placeholder+'" aria-label="'+placeholder+'"></div><button class="pbtn '+(t.state==='dispute'?'p':'s')+'" data-send disabled>'+(t.state==='dispute'?'Send reply':'Send')+'</button></div></section>'}

  i.addEventListener('focus',()=>f.classList.add('focus'));i.addEventListener('blur',()=>f.classList.remove('focus'));i.addEventListener('input',()=>b.disabled=!i.value.trim());
  const send=()=>{const v=i.value.trim();if(!v)return;const d=new Date();list.push(['y','Today · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),v]);root.querySelector('#msgs').innerHTML=msgs(list,t.worker);i.value='';b.disabled=true;refit();

    w.qs.map((q,i)=>'<div class="q"><div class="qh"><span class="num">'+(i+1)+'</span>'+pill(q[1],'accent')+'</div><p>'+E(q[2])+'</p>'+
     (q[0]==='link'?'<div class="mfield'+(st.err&&st.err[i]?' error':'')+'"><input data-q="'+i+'" placeholder="https://" value="'+E(st.ans[i]||'')+'" aria-label="Answer '+(i+1)+'"></div>'+(st.err&&st.err[i]?'<div class="mhelp error">'+st.err[i]+'</div>':'')
      :'<div class="lst">'+q[3].map((o,j)=>'<label class="opt2'+(st.ans[i]===j?' sel':'')+'"><input type="radio" name="q'+i+'" data-q="'+i+'" data-o="'+j+'"'+(st.ans[i]===j?' checked':'')+'>'+E(o)+'</label>').join('')+'</div>'+(st.err&&st.err[i]?'<div class="mhelp error">'+st.err[i]+'</div>':''))+'</div>').join('')+
    '<div class="row2" style="justify-content:flex-end"><small class="muted" style="font:500 13px/18px var(--font);margin-right:auto">You can submit once. Answers can’t be changed after.</small><button class="pbtn p" data-submit>Submit test</button></div></section>'}
  pg.innerHTML=h;wire(root);
  root.querySelectorAll('[data-q]').forEach(el=>{const i=+el.dataset.q;
    if(el.type==='radio')el.addEventListener('change',()=>{st.ans[i]=+el.dataset.o;if(st.err)st.err[i]=null;root.querySelectorAll('input[name=q'+i+']').forEach(r=>r.parentElement.classList.toggle('sel',r.checked))});
    else{el.addEventListener('input',()=>{st.ans[i]=el.value});el.addEventListener('focus',()=>el.parentElement.classList.add('focus'));el.addEventListener('blur',()=>el.parentElement.classList.remove('focus'))}});
  const sb=root.querySelector('[data-submit]');if(sb)sb.addEventListener('click',e=>{e.stopPropagation();st.err={};let bad=0;
    w.qs.forEach((q,i)=>{const a=st.ans[i];if(q[0]==='link'){const v=String(a||'').trim();if(!v){st.err[i]='Add a link to answer.';bad++}else if(!URLRE.test(/^https?:\/\//i.test(v)?v:'https://'+v)){st.err[i]='Enter a full link, like https://dribbble.com/you';bad++}}else if(a==null){st.err[i]='Pick one answer.';bad++}});
    if(bad){show(cur);toast('Answer '+bad+(bad>1?' more questions':' more question')+' to submit.','error');return}
    st.state='grading';show(cur);setTimeout(()=>{st.state='passed';st.score=88;if(cur==='w-'+s.id)show(cur);toast('You passed · 88 / 100. You’re on the candidate list.','success')},2200)});
 }
};

/* ---------- actions ---------- */
function markDirty(){if(cur!=='company')return;const d=isDirty();setDisabled(state.btn.save,!d);setDisabled(state.btn.discard,!d)}
function chipsNow(){return[...stage.querySelectorAll('.chip[data-g="cc"]')].map(x=>x.getAttribute('aria-pressed')).join()}
function isDirty(){for(const k in state.orig)if(state.val[k]()!==state.orig[k])return true;return chipsNow()!==state.chips0}
const ACT={
  create(btn){const v=(state.composer&&state.composer.value||'').trim();if(!v){state.composer&&state.composer.focus();toast('Describe the result first, or pick one of the suggestions.','error');return}
    const to=GS.cat||'ct1-design';GS.vals['draft:desc']=v;GS.vals['draft:title']=suggestTitle(v);btn.classList.add('pressed');setTimeout(()=>show(to),110)},
  step1(btn){const bad=['desc','title'].filter(k=>state.st[k]&&state.st[k]()==='error');
    if(bad.length){state.el[bad[0]].focus();toast('Fill in the '+(bad[0]==='desc'?'task description':'title')+' to continue.','error');return}
    btn.classList.add('pressed');setTimeout(()=>show('ct2'),110)},
  step1note(btn){ACT.step1(btn);setTimeout(()=>{if(cur==='ct2')toast('Steps 2–4 are drawn on the Design example. For Development and QA only the criteria and test questions change.','info')},200)},
  generate(btn){loading(btn,'Generating test…',500,()=>show('ct3b'))},
  wait(){toast(WHY.wait,'info')},
  addfunds(){openFunds()},
  publish(btn){const m=money();if(!m.ok){if(cur==='ct4')show('ct4-low');return}
    loading(btn,'Locking '+fmt(m.total)+' USDC…',1300,()=>{GS.avail-=m.total;GS.locked+=m.total;GS.pub=m.total;GS.pubDraft=draft();show('task-published');toast(fmt(m.total)+' USDC locked. Pico sent the test to eligible workers.','success')})},
  send(btn){const v=state.msg.value.trim();if(!v)return;
    loading(btn,'Sending',700,()=>{state.msg.value='';setDisabled(btn,true);toast('Message sent (prototype — it isn’t saved to the thread).','success')})},
  discard(){for(const k in state.orig)state.set[k](state.orig[k]);
    const on=state.chips0.split(',');stage.querySelectorAll('.chip[data-g="cc"]').forEach((x,i)=>x.setAttribute('aria-pressed',on[i]));
    markDirty();toast('Changes discarded.','info')},
  save(btn){
    const bad=['name','web','desc','mail'].filter(k=>state.st[k]&&state.st[k]()==='error');
    const busy=['web','mail'].filter(k=>state.st[k]&&state.st[k]()==='validating');
    if(bad.length){state.el[bad[0]].focus();toast('Fix '+bad.length+(bad.length>1?' fields':' field')+' before saving.','error');return}
    if(busy.length){toast('Wait for the link check to finish.','info');return}
    loading(btn,'Saving…',900,()=>{for(const k in state.orig)state.orig[k]=state.val[k]();state.chips0=chipsNow();markDirty();toast('Company profile saved.','success')})}
};


/* ---------- render a Figma-exported screen as real DOM ---------- */
function figBuild(k,stage,before){const d=FIG[k];const root=document.createElement('div');root.className='fig';root.style.height=d.h+'px';root.setAttribute('data-screen',k);
  const mk=(n,par)=>{const t=n[0],e=document.createElement('div');let css='left:'+n[1]+'px;top:'+n[2]+'px;width:'+n[3]+'px;height:'+n[4]+'px;';if(n[5]>=0&&t!==2){let st=d.st[n[5]];if(t===0&&st.indexOf('overflow:hidden')>=0&&!(st.indexOf('background')>=0&&st.indexOf('border-radius')>=0))st=st.replace(/;?overflow:hidden/,'');css+=st}
    if(t===1){e.className='ft';const c=n[6];if(typeof c==='string')e.textContent=c;else{const sp=document.createElement('span');for(const [tx,si] of c){const q=document.createElement('span');q.textContent=tx;if(si>=0)q.style.cssText=d.st[si];sp.appendChild(q)}e.appendChild(sp)}}
    else if(t===2){e.className='fi';e.innerHTML=FIGI[n[5]]||'';if(n[6])css+='color:'+n[6]}
    else{e.className='fb';for(const c of n[6])mk(c,e);if(n[7]!=null){const s=document.createElement('i');s.className='fs';s.style.cssText=d.st[n[7]];e.appendChild(s)}}
    e.style.cssText=css;par.appendChild(e)};
  for(const c of d.t[6])mk(c,root);
  const bgc=d.st[d.t[5]];if(bgc)root.style.cssText+=';'+bgc+';height:'+d.h+'px';
  if(d.t[7]!=null){}
  stage.insertBefore(root,before);return root}

/* ---------- render ---------- */
function show(k,replace){
  if(!S[k])k='home';cur=k;if(/^ct1-/.test(k))GS.cat=k;const s=S[k];if(closeMenu)closeMenu();toastEl.hidden=true;if(typeof closeCand==='function'&&!dscrim.hidden)closeCand();
  stage.querySelectorAll(':scope>:not(img)').forEach(n=>n.remove());
  Object.assign(state,{btn:{},val:{},set:{},orig:{},st:{},el:{},composer:null,msg:null,dyn:null,filt:null});
  GS.work=GS.work||{};
  if(s.html){img.style.display='none';img.removeAttribute('src');const root=$('div','app',stage);RENDER[s.html](root,s);s.h=root.offsetHeight}else if(FIG[k]){img.style.display='none';img.removeAttribute('src');figBuild(k,stage,img.nextSibling);s.h=FIG[k].h}else{img.style.display='';img.src='img/'+k+'.jpg';img.alt=s.t+' screen'}
  sel.value=k;document.title='Pico · '+s.t;
  for(const c of s.c){
    if(c.k==='btn')mkBtn(c);else if(c.k==='nav'||c.k==='row'||c.k==='link'||c.k==='lock'||c.k==='chrome')mkLayer(c);else if(c.k==='fld')mkField(c);else if(c.k==='filt')mkFilt(c);else if(c.k==='dyn')mkDyn(c);else if(c.k==='tabs')mkTabs(c);
    else if(c.k==='chip')mkChip(c,k);else if(c.k==='tgl')mkToggle(c);else if(c.k==='faq')mkFaq(c);
    else if(c.k==='composer')mkComposer(c);else if(c.k==='msg')mkMsg(c);
    else if(c.k==='inp'){if(c.t==='select')mkSelect(c);else if(c.t==='search')mkSearch(c);else mkInput(c)}
  }
  if(k==='company'){state.chips0=chipsNow();markDirty();
    state.btn.save._whyDisabled=state.btn.discard._whyDisabled=()=>toast('No changes yet — edit a field to enable Save.','info')}
  if(k==='wr-conversation'){setDisabled(state.btn.send,true);state.btn.send._whyDisabled=()=>{state.msg.focus()}}
  if(state.dyn){updateMoney();fillDraft()}
  if(s.auto){const [to,ms]=s.auto;setTimeout(()=>{if(cur===k)show(to)},ms)}
  for(const c of s.c)if(c.to&&!FIG[c.to]&&!(S[c.to]&&S[c.to].html)){const p=new Image();p.src='img/'+c.to+'.jpg'}
  for(const c of s.c)if(c.act&&c.act.startsWith('go:')){const p=new Image();p.src='img/'+c.act.slice(3)+'.jpg'}
  fit();
  if(replace!==false){try{history.replaceState(null,'','#'+k)}catch(e){}}
  scrollTo({top:0});saveGS();
}
stage.addEventListener('click',()=>{if(closeMenu){closeMenu();return}
  if(S[cur]&&S[cur].html)return;
  stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),700);
  toast('Outlined elements are interactive. The rest of this screen is static layout exported from Figma.','info')});
document.addEventListener('click',()=>closeMenu&&closeMenu());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&closeMenu)closeMenu()});
sel.addEventListener('change',()=>show(sel.value));
tbtn.addEventListener('click',()=>{const on=tbtn.getAttribute('aria-pressed')!=='true';tbtn.setAttribute('aria-pressed',String(on));stage.classList.toggle('show',on)});
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&k!==cur)show(k,false)});
document.getElementById('reset').addEventListener('click',()=>{window.__noSave=true;try{localStorage.removeItem(LSK)}catch(e){}location.hash='#home';location.reload()});
show(location.hash.slice(1)||'home',false);
document.fonts&&document.fonts.ready.then(()=>{if(S[cur]&&S[cur].html)refit()});
</script>
</body>
